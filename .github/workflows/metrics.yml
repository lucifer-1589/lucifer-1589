name: Profile Metrics

# Generates a self-hosted stats+languages+achievements SVG and commits it to
# assets/github-metrics.svg. This exists because the shared public instance of
# github-readme-stats.vercel.app is frequently rate-limited/paused (a known,
# recurring upstream issue, not something wrong with this repo) — self-hosting
# via Action removes that dependency entirely. See MAINTENANCE.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: lucifer-1589
          filename: assets/github-metrics.svg
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: C
