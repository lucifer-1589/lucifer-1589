<svg width="1000" height="14" viewBox="0 0 1000 14" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Reusable neon section separator: gradient line with pulsing end nodes -->
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8a5cf6" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#ff5c8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1000" height="2" fill="url(#line)"/>
  <circle cx="150" cy="7" r="3" fill="#00e5ff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="7" r="3" fill="#8a5cf6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="7" r="3" fill="#ff5c8a">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
