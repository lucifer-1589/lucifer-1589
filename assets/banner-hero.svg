<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep space gradient + faint cyber grid -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8a5cf6"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1c2740" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)" opacity="0.5"/>

  <!-- Top accent rule -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#neon)"/>

  <!-- LEFT: Cybersecurity shield motif -->
  <g transform="translate(120,130)">
    <circle r="58" fill="url(#glow)">
      <animate attributeName="r" values="52;62;52" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,-45 L38,-30 V10 C38,35 20,50 0,58 C-20,50 -38,35 -38,10 V-30 Z"
          fill="none" stroke="#00e5ff" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M-14,0 L-4,12 L18,-14" fill="none" stroke="#8a5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CENTER: AI neural network motif -->
  <g transform="translate(500,130)" stroke="#4dd8ff" stroke-width="1.2" opacity="0.85">
    <line x1="-90" y1="-40" x2="0" y2="0"><animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="0"   x2="0" y2="0"><animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="40"  x2="0" y2="0"><animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="90" y2="-40"><animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="90" y2="0">  <animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="90" y2="40"> <animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></line>

    <g fill="#00e5ff">
      <circle cx="-90" cy="-40" r="5"><animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="-90" cy="0" r="5"><animate attributeName="r" values="4;6;4" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="-90" cy="40" r="5"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="0" cy="0" r="8" fill="#8a5cf6">
      <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <g fill="#ff5c8a">
      <circle cx="90" cy="-40" r="5"><animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="0" r="5"><animate attributeName="r" values="4;6;4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="40" r="5"><animate attributeName="r" values="4;6;4" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- RIGHT: Cloud + orbiting node motif -->
  <g transform="translate(870,130)">
    <path d="M-45,10 a22,22 0 0 1 4,-43 a30,30 0 0 1 56,-6 a24,24 0 0 1 5,49 Z"
          fill="none" stroke="#8a5cf6" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#00e5ff">
      <animateMotion dur="5s" repeatCount="indefinite"
        path="M-45,10 a22,22 0 0 1 4,-43 a30,30 0 0 1 56,-6 a24,24 0 0 1 5,49 Z"/>
    </circle>
  </g>

  <!-- Bottom accent rule -->
  <rect x="0" y="256" width="1000" height="4" fill="url(#neon)"/>
</svg>
